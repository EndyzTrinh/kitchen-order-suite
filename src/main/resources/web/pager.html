<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Thiết bị rung</title>
<!-- Thiết bị rung giả lập (F08): nhận PAGER_CALL qua SSE, xác nhận PAGER_RECEIVED, nút "Đã lấy món" (PICKED_UP). -->
<style>
  :root { --bg:#0f172a; --card:#1e293b; --ink:#f8fafc; --muted:#94a3b8; --green:#16a34a; --red:#dc2626; --blue:#2563eb; }
  * { box-sizing:border-box; }
  html, body { min-height:100%; margin:0; }
  body > * { flex-shrink:0; }
  body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center;
         padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
         -webkit-tap-highlight-color:transparent; transition:background .2s; }
  body.alarm { animation:flash .5s steps(1) infinite; }
  @keyframes flash { 50% { background:var(--red); } }
  button { font-family:inherit; cursor:pointer; border:0; }
  button:active { transform:scale(.97); }
  .label { font-size:14px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .disc { width:150px; height:150px; border-radius:50%; display:grid; place-items:center; position:relative;
          background:radial-gradient(circle at 30% 30%, #334155, #1e293b); box-shadow:0 0 0 8px rgba(255,255,255,.04), 0 20px 40px rgba(0,0,0,.4); }
  body.alarm .disc { animation:pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform:scale(1.08); box-shadow:0 0 0 18px rgba(255,255,255,.15); } }
  #num { font-size:72px; font-weight:800; line-height:1; }
  #status { font-size:14px; font-weight:700; padding:6px 14px; border-radius:99px; background:rgba(148,163,184,.15); color:var(--muted); }
  #status.ok { background:rgba(22,163,74,.18); color:#4ade80; }
  #info { font-size:16px; color:var(--muted); max-width:340px; line-height:1.45; }
  #activate { background:var(--blue); color:#fff; font-size:21px; font-weight:800; padding:18px 40px; border-radius:16px;
              box-shadow:0 10px 26px rgba(37,99,235,.45); }
  #test { background:transparent; color:var(--muted); font-size:15px; padding:10px 18px; border:1px solid #334155; border-radius:12px; }
  #calls { width:100%; max-width:440px; display:flex; flex-direction:column; gap:14px; }
  .call { background:#fff; color:#0f172a; border-radius:20px; padding:18px; text-align:left; box-shadow:0 18px 40px rgba(0,0,0,.35); }
  .call h2 { margin:0 0 4px; font-size:30px; font-weight:800; }
  .call .sub { color:#64748b; font-size:14px; margin-bottom:10px; font-weight:600; }
  .call ul { list-style:none; padding:0; margin:0 0 14px; }
  .call li { font-size:20px; font-weight:600; padding:10px 0; border-top:1px solid #e2e8f0; display:flex; justify-content:space-between; }
  .call li b { color:#2563eb; }
  .call button { background:var(--green); color:#fff; width:100%; font-size:21px; font-weight:800; padding:18px; border-radius:14px;
                 box-shadow:0 8px 20px rgba(22,163,74,.35); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="label">Thiết bị rung</div>
<div class="disc"><div id="num">?</div></div>
<div id="status">Chưa kết nối</div>
<div id="info">Bấm "Kích hoạt" để cho phép phát chuông</div>
<button id="activate">Kích hoạt</button>
<div id="calls"></div>
<button id="test" hidden>Thử chuông (3 giây)</button>

<script>
const pagerId = Number(new URLSearchParams(location.search).get('id')) || 0;
document.getElementById('num').textContent = pagerId || '?';

let audio = null;
let alarmTimer = null;
const calls = {};          // call_id -> lệnh đang mở

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- âm thanh và báo động ----------
function beep(seconds) {
  if (!audio) return;
  audio.resume();
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.frequency.value = 880;
  gain.gain.value = 0.4;
  osc.connect(gain).connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + seconds);
}

function startAlarm() {
  document.body.classList.add('alarm');
  if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]);   // chỉ Android có rung
  if (!alarmTimer) alarmTimer = setInterval(() => beep(0.25), 600);
}

function stopAlarm() {
  document.body.classList.remove('alarm');
  if (navigator.vibrate) navigator.vibrate(0);
  clearInterval(alarmTimer);
  alarmTimer = null;
}

// ---------- hiển thị các lệnh đang mở ----------
function render() {
  const box = document.getElementById('calls');
  box.innerHTML = '';
  for (const id in calls) {
    const c = calls[id];
    const div = document.createElement('div');
    div.className = 'call';
    const items = c.items.map(it => '<li><span>' + esc(it.name) + '</span><b>×' + esc(it.qty) + '</b></li>').join('');
    div.innerHTML = '<h2>Bàn ' + esc(c.table) + '</h2><div class="sub">Món đã xong - mời lấy ở bếp</div><ul>' + items +
                    '</ul><button>Đã lấy món</button>';
    div.querySelector('button').onclick = () => pickedUp(c.call_id);
    box.appendChild(div);
  }
  if (Object.keys(calls).length === 0) stopAlarm();
}

// ---------- giao tiếp với máy chủ ----------
function post(path, body) {
  return fetch(path, { method: 'POST', body: JSON.stringify(body) }).then(r => r.json());
}

async function pickedUp(callId) {
  try {
    await post('/api/pager/ack', { command: 'PICKED_UP', call_id: callId, pager_id: pagerId });
  } catch (e) { /* mất mạng: máy chủ sẽ rung lại, bấm lại sau */ }
  delete calls[callId];
  render();
}

function connect() {
  const status = document.getElementById('status');
  const es = new EventSource('/api/pager/events?id=' + pagerId);   // tự kết nối lại khi mất mạng

  es.onopen = () => { status.textContent = '● Đã kết nối máy chủ'; status.className = 'ok'; };
  es.onerror = () => { status.textContent = '○ Mất kết nối - đang thử lại...'; status.className = ''; };

  es.addEventListener('PAGER_CALL', e => {
    const c = JSON.parse(e.data);
    post('/api/pager/received', { command: 'PAGER_RECEIVED', call_id: c.call_id, pager_id: pagerId })
      .catch(() => {});
    calls[c.call_id] = c;          // lệnh gửi lại có cùng call_id nên không bị trùng
    render();
    startAlarm();
  });

  es.addEventListener('PAGER_CLOSE', e => {
    const c = JSON.parse(e.data);
    delete calls[c.call_id];
    render();
  });
}

// Safari chỉ cho phát âm thanh sau một thao tác chạm của người dùng.
document.getElementById('activate').onclick = async () => {
  if (!pagerId) { document.getElementById('info').textContent = 'Thiếu số thiết bị: mở /pager?id=1'; return; }
  audio = new (window.AudioContext || window.webkitAudioContext)();
  await audio.resume();
  beep(0.05);
  document.getElementById('activate').hidden = true;
  document.getElementById('test').hidden = false;
  document.getElementById('info').textContent = 'Giữ màn hình luôn sáng, tắt chế độ im lặng.';
  connect();
  // heartbeat mỗi 5 giây để quầy biết thiết bị còn hoạt động (F11)
  setInterval(() => post('/api/pager/heartbeat', { command: 'PING', pager_id: pagerId }).catch(() => {}), 5000);
};

document.getElementById('test').onclick = () => {
  startAlarm();
  setTimeout(() => { if (Object.keys(calls).length === 0) stopAlarm(); }, 3000);
};
</script>
</body>
</html>
